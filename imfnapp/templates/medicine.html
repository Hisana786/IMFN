{% extends 'pharmindex.html' %}
{% block content %}
<html>
    <head>
        <title>Form Registration</title>
        <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: #eef2f5;
                margin: 0;
                padding: 0;
            }
    
            h1 {
                text-align: center;
                margin-top: 50px;
                color: #333;
            }
    
            form {
                max-width: 600px;
                margin: 30px auto;
                padding: 30px;
                background-color: #ffffff;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            }
    
            form p {
                margin-bottom: 20px;
            }
    
            input[type="text"],
            input[type="email"],
            input[type="password"],
            textarea,
            select {
                width: 100%;
                padding: 12px;
                border: 1px solid #ccc;
                border-radius: 8px;
                font-size: 15px;
                box-sizing: border-box;
                background-color: #f9f9f9;
            }
    
            button {
                display: block;
                width: 100%;
                padding: 12px;
                background-color: #007bff;
                color: white;
                font-size: 16px;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                transition: background-color 0.3s ease;
                margin-top: 20px;
            }
    
            button:hover {
                background-color: #0056b3;
            }
        </style>
    </head>
    <body>
        <h1>Medicine</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Submit</button>
        </form>
    </body>
</html>
{% endblock %}
